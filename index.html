<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anscript Hub V2 - Hệ Thống Quản Trị Tối Cao</title>
    <style>
        :root {
            --bg-main: #121212;
            --bg-card: #1e1e1e;
            --text-main: #eeeeee;
            --primary: #00adb5;
            --danger: #ff4444;
            --success: #00c851;
            --warning: #ffbb33;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1, h2 {
            text-align: center;
            color: var(--text-main);
        }
        .card {
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-row {
            display: flex;
            gap: 15px;
        }
        .form-row .form-group {
            flex: 1;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #b3b3b3;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            background-color: #2d2d2d;
            border: 1px solid #444;
            border-radius: 4px;
            color: #fff;
            box-sizing: border-box;
        }
        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
            outline: none;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-primary { background-color: var(--primary); color: #fff; }
        .btn-primary:hover { background-color: #008c95; }
        .btn-danger { background-color: var(--danger); color: #fff; }
        .btn-danger:hover { background-color: #cc0000; }
        .btn-warning { background-color: var(--warning); color: #222; }
        .btn-warning:hover { background-color: #e0a800; }
        .btn-submit {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            background-color: #2979ff;
            color: #fff;
        }
        .btn-submit:hover { background-color: #004ecb; }
        
        /* Cấu trúc cây Script */
        .item-list { margin-top: 10px; padding-left: 15px; border-left: 2px solid var(--primary); }
        .tab-item { background: #252525; padding: 10px; margin: 10px 0; border-radius: 4px; }
        .script-item { background: #353535; padding: 10px; margin: 8px 0; border-radius: 4px; }
        .item-header { display: flex; justify-content: space-between; align-items: center; }
        .badge { background: #444; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
        .actions { display: flex; gap: 5px; }
        
        /* Modal Sửa Script */
        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
        }
        .modal-content {
            background-color: var(--bg-card); margin: 5% auto; padding: 20px;
            border-radius: 8px; width: 90%; max-width: 600px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Anscript Hub V2 – Hệ Thống Quản Trị Tối Cao</h1>

    <!-- Cấu hình chung -->
    <div class="card">
        <h2>🏠 Cấu Hình Trang Chủ (Home Tab)</h2>
        <div class="form-row">
            <div class="form-group">
                <label>Tên Hub</label>
                <input type="text" id="hub-name" placeholder="Nhập tên Hub...">
            </div>
            <div class="form-group">
                <label>Phiên bản</label>
                <input type="text" id="hub-version" placeholder="v1.0">
            </div>
        </div>
        <div class="form-group">
            <label>Lời Giới Thiệu (Introduction)</label>
            <textarea id="hub-intro" rows="3" placeholder="Nhập lời chào mừng..."></textarea>
        </div>
    </div>

    <!-- Thêm Thành Phần -->
    <div class="card">
        <h2>➕ Thêm Thành Phần Vào Hub</h2>
        <div class="form-group">
            <label>Phương thức nhập dữ liệu:</label>
            <select id="input-mode" onchange="toggleInputMode()">
                <option value="manual">1. Nhập thủ công (Form)</option>
                <option value="syntax">2. Nhập nhanh bằng lệnh cú pháp (/s/ và /t/)</option>
            </select>
        </div>

        <!-- Khối Nhập Thủ Công -->
        <div id="manual-input-block">
            <div class="form-row">
                <div class="form-group">
                    <label>Loại thành phần:</label>
                    <select id="add-type" onchange="toggleAddFields()">
                        <option value="tab">Tạo Tab Mới</option>
                        <option value="script">Thêm Script Vào Tab</option>
                    </select>
                </div>
                <div class="form-group" id="field-tab-name">
                    <label>Tên Tab Mới</label>
                    <input type="text" id="new-tab-name" placeholder="Nhập tên Tab...">
                </div>
            </div>

            <div id="script-fields" style="display: none;">
                <div class="form-group">
                    <label>Chọn Tab Mục Tiêu (Bắt buộc phải có Tab)</label>
                    <select id="target-tab-select"></select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Tên Script</label>
                        <input type="text" id="new-script-name" placeholder="Ví dụ: Auto Farm Blox Fruit">
                    </div>
                    <div class="form-group">
                        <label>Mô tả ngắn</label>
                        <input type="text" id="new-script-desc" placeholder="Ví dụ: Auto Farm, No Key...">
                    </div>
                </div>
                <div class="form-group">
                    <label>Mã nguồn Script (Content Code / Link Raw)</label>
                    <textarea id="new-script-content" rows="3" placeholder="loadstring(game:HttpGet(...))()"></textarea>
                </div>
            </div>

            <button class="btn-primary" onclick="addNewElement()">Tạo Thành Phần</button>
        </div>

        <!-- Khối Nhập Nhanh Cú Pháp -->
        <div id="syntax-input-block" style="display: none;">
            <div class="form-group">
                <label>Dán mã cú pháp (Hỗ trợ nhiều dòng cùng lúc):</label>
                <textarea id="syntax-code" rows="5" placeholder="Cú pháp ví dụ:&#10;/t/Main Tab&#10;/s/Auto Farm/Hỗ trợ cày cấp/loadstring(...)()/Main Tab"></textarea>
            </div>
            <p style="font-size: 13px; color: #aaa; margin-top: -5px;">
                * Cú pháp Tab: <code>/t/Tên Tab</code><br>
                * Cú pháp Script: <code>/s/Tên script/Mô tả/mã script/Tên tab</code>
            </p>
            <button class="btn-primary" onclick="parseSyntaxInput()">Phân Tích Và Nhập</button>
        </div>
    </div>

    <!-- Quản Lý Danh Sách -->
    <div class="card">
        <h2>⚙️ Cấu Trúc Script Và Quản Lý (Sửa / Xóa)</h2>
        <div id="tabs-tree-container"></div>
    </div>

    <button class="btn-submit" onclick="saveDataToServer()">💾 LƯU TOÀN BỘ DỮ LIỆU LÊN SERVER RENDER</button>
</div>

<!-- Modal Sửa Script -->
<div id="edit-modal" class="modal">
    <div class="modal-content">
        <h2>✏️ Chỉnh Sửa Script</h2>
        <input type="hidden" id="edit-tab-idx">
        <input type="hidden" id="edit-script-idx">
        <div class="form-group">
            <label>Tên Script</label>
            <input type="text" id="edit-script-name">
        </div>
        <div class="form-group">
            <label>Mô tả ngắn</label>
            <input type="text" id="edit-script-desc">
        </div>
        <div class="form-group">
            <label>Nội dung Script</label>
            <textarea id="edit-script-content" rows="5"></textarea>
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <button class="btn-primary" onclick="saveEditScript()">Lưu Cập Nhật</button>
            <button class="btn-danger" onclick="closeEditModal()">Hủy</button>
        </div>
    </div>
</div>

<script>
    let hubData = {
        Info: { Name: "", Version: "", Creator: "Hothiptv", ThemeColor: [0, 173, 181] },
        HomeTab: { Introduction: "", Elements: [] },
        Tabs: []
    };

    window.onload = async function() {
        await loadDataFromServer();
    };

    async function loadDataFromServer() {
        try {
            const response = await fetch('/raw-hub?t=' + Date.now());
            if (response.ok) {
                hubData = await response.json();
                document.getElementById('hub-name').value = hubData.Info?.Name || "";
                document.getElementById('hub-version').value = hubData.Info?.Version || "";
                document.getElementById('hub-intro').value = hubData.HomeTab?.Introduction || "";
                
                renderTabsTree();
                updateTabSelectOptions();
            } else {
                alert("❌ Không thể lấy dữ liệu từ server!");
            }
        } catch (error) {
            console.error("Lỗi kết nối:", error);
        }
    }

    function toggleInputMode() {
        const mode = document.getElementById('input-mode').value;
        document.getElementById('manual-input-block').style.display = (mode === 'manual') ? 'block' : 'none';
        document.getElementById('syntax-input-block').style.display = (mode === 'syntax') ? 'block' : 'none';
    }

    function toggleAddFields() {
        const type = document.getElementById('add-type').value;
        document.getElementById('field-tab-name').style.display = (type === 'tab') ? 'block' : 'none';
        document.getElementById('script-fields').style.display = (type === 'script') ? 'block' : 'none';
    }

    function updateTabSelectOptions() {
        const select = document.getElementById('target-tab-select');
        select.innerHTML = "";
        if (!hubData.Tabs || hubData.Tabs.length === 0) {
            let opt = document.createElement('option');
            opt.value = "";
            opt.innerText = "-- Chưa có Tab nào (Hãy tạo Tab trước) --";
            select.appendChild(opt);
            return;
        }
        hubData.Tabs.forEach((tab, index) => {
            let opt = document.createElement('option');
            opt.value = index;
            opt.innerText = tab.Name;
            select.appendChild(opt);
        });
    }

    function addNewElement() {
        const type = document.getElementById('add-type').value;

        if (type === 'tab') {
            const name = document.getElementById('new-tab-name').value.trim();
            if (!name) return alert("Vui lòng nhập tên Tab!");
            hubData.Tabs.push({ Name: name, Sections: [], StandaloneScripts: [] });
            document.getElementById('new-tab-name').value = "";
        } else {
            const tabIdx = document.getElementById('target-tab-select').value;
            if (tabIdx === "" || tabIdx === null) return alert("Chưa chọn Tab! Vui lòng tạo Tab trước khi thêm Script.");
            
            const name = document.getElementById('new-script-name').value.trim();
            const desc = document.getElementById('new-script-desc').value.trim();
            const content = document.getElementById('new-script-content').value.trim();

            if (!name || !content) return alert("Vui lòng điền đầy đủ tên và mã script!");

            if (!hubData.Tabs[tabIdx].StandaloneScripts) hubData.Tabs[tabIdx].StandaloneScripts = [];
            hubData.Tabs[tabIdx].StandaloneScripts.push({ Name: name, Desc: desc, Content: content });

            document.getElementById('new-script-name').value = "";
            document.getElementById('new-script-desc').value = "";
            document.getElementById('new-script-content').value = "";
        }

        renderTabsTree();
        updateTabSelectOptions();
    }

    // Nhập nhanh cú pháp dạng /t/ và /s/
    function parseSyntaxInput() {
        const text = document.getElementById('syntax-code').value.trim();
        if (!text) return alert("Vui lòng nhập lệnh cú pháp!");

        const lines = text.split('\n');
        let successCount = 0;

        lines.forEach(line => {
            line = line.trim();
            if (line.startsWith('/t/')) {
                const tabName = line.substring(3).trim();
                if (tabName) {
                    let exists = hubData.Tabs.find(t => t.Name.toLowerCase() === tabName.toLowerCase());
                    if (!exists) {
                        hubData.Tabs.push({ Name: tabName, Sections: [], StandaloneScripts: [] });
                    }
                    successCount++;
                }
            } else if (line.startsWith('/s/')) {
                const parts = line.substring(3).split('/');
                if (parts.length >= 4) {
                    const scriptName = parts[0].trim();
                    const scriptDesc = parts[1].trim();
                    const scriptContent = parts[2].trim();
                    const tabTargetName = parts[3].trim();

                    let targetTab = hubData.Tabs.find(t => t.Name.toLowerCase() === tabTargetName.toLowerCase());
                    if (!targetTab) {
                        // Tự tạo Tab mới nếu chưa có
                        targetTab = { Name: tabTargetName, Sections: [], StandaloneScripts: [] };
                        hubData.Tabs.push(targetTab);
                    }

                    if (!targetTab.StandaloneScripts) targetTab.StandaloneScripts = [];
                    targetTab.StandaloneScripts.push({
                        Name: scriptName,
                        Desc: scriptDesc,
                        Content: scriptContent
                    });
                    successCount++;
                }
            }
        });

        document.getElementById('syntax-code').value = "";
        renderTabsTree();
        updateTabSelectOptions();
        alert(`✅ Đã phân tích và xử lý xong ${successCount} lệnh!`);
    }

    function deleteTab(tabIndex) {
        if (confirm("Bạn có chắc chắn muốn xóa Tab này cùng toàn bộ Script bên trong không?")) {
            hubData.Tabs.splice(tabIndex, 1);
            renderTabsTree();
            updateTabSelectOptions();
        }
    }

    function deleteScript(tabIndex, scriptIndex) {
        if (confirm("Xóa Script này?")) {
            hubData.Tabs[tabIndex].StandaloneScripts.splice(scriptIndex, 1);
            renderTabsTree();
        }
    }

    function openEditScriptModal(tIdx, sIdx) {
        const script = hubData.Tabs[tIdx].StandaloneScripts[sIdx];
        document.getElementById('edit-tab-idx').value = tIdx;
        document.getElementById('edit-script-idx').value = sIdx;
        document.getElementById('edit-script-name').value = script.Name || "";
        document.getElementById('edit-script-desc').value = script.Desc || "";
        document.getElementById('edit-script-content').value = script.Content || "";
        document.getElementById('edit-modal').style.display = 'block';
    }

    function closeEditModal() {
        document.getElementById('edit-modal').style.display = 'none';
    }

    function saveEditScript() {
        const tIdx = document.getElementById('edit-tab-idx').value;
        const sIdx = document.getElementById('edit-script-idx').value;

        const name = document.getElementById('edit-script-name').value.trim();
        const desc = document.getElementById('edit-script-desc').value.trim();
        const content = document.getElementById('edit-script-content').value.trim();

        if (!name || !content) return alert("Không được để trống Tên và Nội dung Script!");

        hubData.Tabs[tIdx].StandaloneScripts[sIdx] = { Name: name, Desc: desc, Content: content };
        closeEditModal();
        renderTabsTree();
    }

    function renderTabsTree() {
        const container = document.getElementById('tabs-tree-container');
        container.innerHTML = "";

        if (!hubData.Tabs || hubData.Tabs.length === 0) {
            container.innerHTML = "<p style='color: #888; text-align:center;'>Chưa có Tab Script nào được tạo.</p>";
            return;
        }

        hubData.Tabs.forEach((tab, tIdx) => {
            let tabDiv = document.createElement('div');
            tabDiv.className = 'tab-item';
            tabDiv.innerHTML = `
                <div class="item-header">
                    <strong>📁 Tab: ${tab.Name}</strong>
                    <button class="btn-danger" style="padding:4px 8px; font-size:12px;" onclick="deleteTab(${tIdx})">Xóa Tab</button>
                </div>
                <div class="item-list" id="scripts-of-tab-${tIdx}"></div>
            `;
            container.appendChild(tabDiv);

            const scriptListContainer = document.getElementById(`scripts-of-tab-${tIdx}`);
            
            if (tab.StandaloneScripts && tab.StandaloneScripts.length > 0) {
                tab.StandaloneScripts.forEach((script, sIdx) => {
                    let scriptDiv = document.createElement('div');
                    scriptDiv.className = 'script-item';
                    scriptDiv.innerHTML = `
                        <div class="item-header">
                            <div>📜 Script: <strong>${script.Name}</strong></div>
                            <div class="actions">
                                <button class="btn-warning" style="padding:3px 8px; font-size:11px;" onclick="openEditScriptModal(${tIdx}, ${sIdx})">Sửa</button>
                                <button class="btn-danger" style="padding:3px 8px; font-size:11px;" onclick="deleteScript(${tIdx}, ${sIdx})">Xóa</button>
                            </div>
                        </div>
                        <div style="font-size:12px; color:#aaa; margin-top:4px;">Mô tả: ${script.Desc || "Không có mô tả"}</div>
                    `;
                    scriptListContainer.appendChild(scriptDiv);
                });
            } else {
                scriptListContainer.innerHTML = "<p style='color: #666; font-size: 13px;'>Tab này chưa chứa Script nào.</p>";
            }
        });
    }

    async function saveDataToServer() {
        hubData.Info.Name = document.getElementById('hub-name').value.trim();
        hubData.Info.Version = document.getElementById('hub-version').value.trim();
        hubData.HomeTab.Introduction = document.getElementById('hub-intro').value.trim();

        try {
            const response = await fetch('/save-hub', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(hubData)
            });

            const result = await response.json();
            if (response.ok && result.success) {
                alert("🎉 Đã lưu và đồng bộ trực tiếp lên dữ liệu gốc GitHub thành công!");
                await loadDataFromServer();
            } else {
                alert("❌ Lỗi lưu file: " + (result.message || "Từ chối kết nối"));
            }
        } catch (error) {
            alert("❌ Không thể kết nối đến máy chủ Render để ghi dữ liệu!");
            console.error(error);
        }
    }
</script>

</body>
</html>
